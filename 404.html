<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>404 • Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #050f19 0%, #000000 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(255, 80, 120, 0.05), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 10;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .lang-btn {
            background: rgba(20, 28, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #cbd5e6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: rgba(100, 130, 200, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
        }

        .lang-btn:hover {
            background: rgba(100, 130, 200, 0.35);
        }

        .glass-card {
            background: rgba(20, 28, 40, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .icon-404 {
            font-size: 4rem;
            background: linear-gradient(135deg, #b8ccff, #7a95d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #FFFFFF, #a0b8e8, #7c8ec0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.05em;
            margin: 0.5rem 0;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(120deg, #FFFFFF, #C0D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
        }

        .description {
            color: #9aa9c1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.8rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            background: linear-gradient(95deg, #2a2f42, #1e2335);
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #eef3ff;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .btn-home:hover {
            background: linear-gradient(95deg, #3a3f58, #282e44);
            transform: translateY(-1px);
        }

        .info-box {
            margin-top: 1.8rem;
            background: rgba(100, 120, 160, 0.1);
            border-radius: 1.5rem;
            padding: 0.9rem;
            border-left: 3px solid #7c8db0;
        }

        .info-text {
            color: #b7c4e2;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .suggestion-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(140, 160, 200, 0.15);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #a6b9dc;
            margin-top: 0.7rem;
        }

        @media (max-width: 550px) {
            .glass-card { padding: 1.8rem 1.5rem; }
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">РУС</button>
        <button class="lang-btn" data-lang="en">ENG</button>
    </div>

    <div class="glass-card">
        <div class="icon-404">
            <i class="fas fa-compass"></i>
        </div>
        <div class="error-code">404</div>
        <h1 id="errorTitle">страница не найдена</h1>
        <div class="description" id="errorDesc">
            Похоже, вы отправились в путешествие по неизведанным просторам.<br>
            Этой страницы не существует.
        </div>
        <button class="btn-home" id="backHomeBtn">
            <i class="fas fa-home"></i>
            <span id="homeBtnText">на главную</span>
        </button>
        <div class="info-box">
            <div class="info-text" id="infoText">
                <i class="fas fa-link"></i> возможно, ссылка устарела или введена с ошибкой
            </div>
            <div class="suggestion-badge" id="suggestionBadge">
                <i class="fas fa-search"></i> проверьте правильность адреса
            </div>
        </div>
    </div>
</div>

<script>
    const translations = {
        ru: {
            errorTitle: "страница не найдена",
            errorDesc: "Похоже, вы отправились в путешествие по неизведанным просторам. Этой страницы не существует.",
            homeBtnText: "на главную",
            infoText: "<i class='fas fa-link'></i> возможно, ссылка устарела или введена с ошибкой",
            suggestionBadge: "<i class='fas fa-search'></i> проверьте правильность адреса"
        },
        en: {
            errorTitle: "page not found",
            errorDesc: "It seems you've ventured into uncharted territory. This page doesn't exist.",
            homeBtnText: "back to home",
            infoText: "<i class='fas fa-link'></i> the link may be outdated or entered incorrectly",
            suggestionBadge: "<i class='fas fa-search'></i> check the address"
        }
    };

    let currentLang = 'en';

    function updateLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('errorTitle').innerText = t.errorTitle;
        document.getElementById('errorDesc').innerHTML = t.errorDesc;
        document.getElementById('homeBtnText').innerText = t.homeBtnText;
        document.getElementById('infoText').innerHTML = t.infoText;
        document.getElementById('suggestionBadge').innerHTML = t.suggestionBadge;
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => updateLanguage(btn.getAttribute('data-lang')));
    });

    document.getElementById('backHomeBtn').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = '/';
    });

    updateLanguage('en');
</script>
</body>
</html>
