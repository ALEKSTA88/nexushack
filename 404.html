<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>404 • Страница не найдена</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(5, 15, 25, 1) 0%, rgba(0, 0, 0, 0.95) 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* анимированные фоновые элементы */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(ellipse at 30% 40%, rgba(255, 80, 120, 0.08), transparent 70%);
            pointer-events: none;
            animation: slowDrift 24s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 130%;
            height: 130%;
            bottom: -30%;
            right: -30%;
            background: radial-gradient(ellipse at 70% 80%, rgba(80, 160, 255, 0.06), transparent 70%);
            pointer-events: none;
            animation: slowDriftReverse 20s infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(3%, 2%) scale(1.05); opacity: 0.9; }
        }

        @keyframes slowDriftReverse {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-2%, -3%) scale(1.07); opacity: 0.8; }
        }

        /* стеклянная карточка */
        .glass-card {
            background: rgba(20, 28, 40, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            width: 100%;
            max-width: 560px;
            padding: 2.5rem 2rem 3rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            border-radius: 3rem 3rem 0 0;
        }

        /* 404 номер с эффектом */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #FFFFFF, #a0b8e8, #7c8ec0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(120, 160, 255, 0.3);
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        /* иконка с анимацией */
        .icon-404 {
            font-size: 4rem;
            background: linear-gradient(135deg, #b8ccff, #7a95d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #FFFFFF, #C0D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.5rem;
        }

        .description {
            color: #9aa9c1;
            font-weight: 400;
            font-size: 0.95rem;
            margin-top: 0.8rem;
            line-height: 1.5;
        }

        /* кнопка возврата */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            background: linear-gradient(95deg, #2a2f42, #1e2335);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #eef3ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.8rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
        }

        .btn-home i {
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn-home:hover {
            background: linear-gradient(95deg, #3a3f58, #282e44);
            transform: scale(1.02);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 180, 200, 0.4);
        }

        .btn-home:active {
            transform: scale(0.98);
        }

        /* дополнительная информация */
        .info-box {
            margin-top: 1.8rem;
            background: rgba(100, 120, 160, 0.12);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 0.9rem 1.2rem;
            border-left: 4px solid #7c8db0;
        }

        .info-text {
            color: #b7c4e2;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .info-text i {
            color: #8d9fcc;
        }

        .suggestion-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(140, 160, 200, 0.2);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #a6b9dc;
            margin-top: 0.8rem;
            backdrop-filter: blur(4px);
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #5c6a89;
            margin-top: 2rem;
            letter-spacing: 0.3px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
        }

        /* декоративные элементы */
        .glow-dot {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 120, 160, 0.2), transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* анимация для маленьких звёзд */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            pointer-events: none;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.2); }
        }

        @media (max-width: 550px) {
            .glass-card {
                padding: 2rem 1.5rem 2.2rem;
                border-radius: 2rem;
            }
            .error-code {
                font-size: 5.5rem;
            }
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="icon-404">
        <i class="fas fa-compass"></i>
    </div>
    <div class="error-code">404</div>
    <h1>страница не найдена</h1>
    <div class="description">
        Похоже, вы отправились в путешествие по неизведанным просторам.<br>
        Этой страницы не существует в нашей вселенной.
    </div>

    <a href="#" class="btn-home" id="backHomeBtn">
        <i class="fas fa-home"></i> 
        <span>вернуться на главную</span>
    </a>

    <div class="info-box">
        <div class="info-text">
            <i class="fas fa-info-circle"></i> возможно, ссылка устарела или была введена с ошибкой
        </div>
        <div class="suggestion-badge">
            <i class="fas fa-search"></i>  проверьте правильность адреса  <i class="fas fa-arrow-right"></i>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-map-signs"></i>  404
    </div>
</div>

<!-- декоративные элементы -->
<div class="glow-dot" style="top: 15%; left: -5%; opacity: 0.5;"></div>
<div class="glow-dot" style="bottom: 5%; right: -8%; width: 180px; height: 180px; background: radial-gradient(circle, rgba(100, 150, 255, 0.2), transparent 80%);"></div>

<script>
    (function() {
        // создаём несколько плавающих звёздочек для атмосферы
        function createStars() {
            const starCount = 25;
            for(let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(star);
            }
        }
        createStars();

        // кнопка "вернуться на главную" — просто красивое уведомление (заглушка)
        const backBtn = document.getElementById('backHomeBtn');
        if(backBtn) {
            backBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // элегантное уведомление, что это демо
                const btn = backBtn;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> демонстрационная версия';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1200);
                
                // лёгкая анимация карточки
                const card = document.querySelector('.glass-card');
                card.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    card.style.transform = '';
                }, 200);
            });
        }

        // эффект при наведении на error-code (игровой момент)
        const errorCode = document.querySelector('.error-code');
        if(errorCode) {
            errorCode.addEventListener('mouseenter', () => {
                errorCode.style.transform = 'scale(1.05)';
                errorCode.style.transition = 'transform 0.2s ease';
            });
            errorCode.addEventListener('mouseleave', () => {
                errorCode.style.transform = 'scale(1)';
            });
        }

        // анимация появления страницы
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.8s ease';
        setTimeout(() => { document.body.style.opacity = '1'; }, 50);
        
        // красивая консольная заглушка
        console.log('%c✨ 404', 'color: #a0b8e8; font-size: 14px; font-family: monospace;');
    })();
</script>
</body>
</html>
