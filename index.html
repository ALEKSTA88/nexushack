<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Вход • Атмосферная заглушка</title>
    <!-- Google Fonts для элегантной типографики -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (Free) для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(5, 15, 25, 1) 0%, rgba(0, 0, 0, 0.95) 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* анимированные абстрактные фоновые элементы */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(ellipse at 30% 40%, rgba(255, 80, 120, 0.08), transparent 70%);
            pointer-events: none;
            animation: slowDrift 24s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 130%;
            height: 130%;
            bottom: -30%;
            right: -30%;
            background: radial-gradient(ellipse at 70% 80%, rgba(80, 160, 255, 0.06), transparent 70%);
            pointer-events: none;
            animation: slowDriftReverse 20s infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(3%, 2%) scale(1.05); opacity: 0.9; }
        }

        @keyframes slowDriftReverse {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-2%, -3%) scale(1.07); opacity: 0.8; }
        }

        /* главная карточка — стеклянный эффект */
        .glass-card {
            background: rgba(20, 28, 40, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2rem 3rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        /* декоративные блики */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            border-radius: 3rem 3rem 0 0;
        }

        /* Заголовок и иконка */
        .icon-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .lock-icon {
            font-size: 3.8rem;
            background: linear-gradient(135deg, #fff, #b0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(120deg, #FFFFFF, #C0D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.5rem;
        }

        .sub {
            color: #9aa9c1;
            font-weight: 400;
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        /* поля ввода */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7e8aa8;
            font-size: 1.2rem;
            transition: color 0.2s;
            pointer-events: none;
        }

        input {
            width: 100%;
            background: rgba(12, 18, 28, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 1rem 1rem 2.8rem;
            font-size: 1rem;
            font-family: 'Inter', monospace;
            border-radius: 2rem;
            color: #f0f3fa;
            outline: none;
            transition: all 0.25s ease;
            letter-spacing: 0.2px;
            font-weight: 500;
        }

        input:focus {
            border-color: rgba(255, 130, 170, 0.7);
            background: rgba(18, 26, 40, 0.9);
            box-shadow: 0 0 0 3px rgba(255, 100, 140, 0.2);
        }

        input::placeholder {
            color: #5f6c8a;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* кнопка */
        .btn-submit {
            width: 100%;
            background: linear-gradient(95deg, #2a2f42, #1e2335);
            border: none;
            padding: 1rem;
            border-radius: 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #eef3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-submit i {
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            background: linear-gradient(95deg, #3a3f58, #282e44);
            transform: scale(1.01);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 180, 200, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* сообщение заглушки — теперь нейтральное, без «неправильно» */
        .info-message {
            margin-top: 1.8rem;
            background: rgba(100, 120, 160, 0.12);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1rem 1.2rem;
            border-left: 4px solid #7c8db0;
            transition: all 0.25s ease;
            text-align: center;
        }

        .info-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 600;
            color: #cbd8f0;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
            margin-bottom: 0.5rem;
        }

        .info-title i {
            font-size: 1.2rem;
            color: #8d9fcc;
        }

        .info-details {
            color: #b7c4e2;
            font-size: 0.85rem;
            font-weight: 500;
            word-break: break-word;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            margin-top: 0.3rem;
        }

        /* элегантный бейдж */
        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(140, 160, 200, 0.2);
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #a6b9dc;
            margin-top: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #5c6a89;
            margin-top: 2rem;
            letter-spacing: 0.3px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
        }

        /* декоративные светящиеся точки */
        .glow-dot {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 120, 160, 0.2), transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 550px) {
            .glass-card {
                padding: 2rem 1.5rem 2.2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="icon-header">
        <div class="lock-icon">
            <i class="fas fa-door-open"></i>
        </div>
        <h1>Panel</h1>
        <div class="sub">вход</div>
    </div>

    <!-- форма входа — стильная заглушка, никаких упоминаний "неправильно" -->
    <div class="input-group">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="emailInput" placeholder="example@domain.com" value="" autocomplete="off">
    </div>
    <div class="input-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="passwordInput" placeholder="password" value="" autocomplete="off">
    </div>

    <button class="btn-submit" id="submitBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> 
        <span>Login</span>
    </button>

<!-- плавающие декоративные элементы -->
<div class="glow-dot" style="top: 15%; left: -5%; opacity: 0.5;"></div>
<div class="glow-dot" style="bottom: 5%; right: -8%; width: 180px; height: 180px; background: radial-gradient(circle, rgba(100, 150, 255, 0.2), transparent 80%);"></div>

<script>
    (function() {
        // Элементы DOM
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const infoDetailsSpan = document.getElementById('infoDetails');

        // просто элегантные фразы для заглушки (нейтральные, только визуальное сопровождение)
        const demoPhrases = [
            '🧪 интерактивный макет • данные не обрабатываются',
            '🎨 стилизованная демонстрация входа',
            '✨ интерфейс • красивая заглушка',
            '💎 образец современной формы авторизации',
            '🌟 визуальный концепт • никакой бэкенд',
            '🖌️ дизайн-демо • атмосферная графика',
            '🔮 просто эстетика • вход не выполняет действий'
        ];

        function updateDemoMessage() {
            const emailVal = emailInput.value.trim() || '<пустое поле>';
            const passLen = passwordInput.value.length;
            let passDisplay = passLen === 0 ? '<пусто>' : '•'.repeat(Math.min(passLen, 6)) + (passLen > 6 ? '…' : '');
            
            const randomPhrase = demoPhrases[Math.floor(Math.random() * demoPhrases.length)];
            infoDetailsSpan.innerHTML = `<i class="fas fa-laptop-code"></i> ${randomPhrase}<br><span style="font-size:0.72rem; opacity:0.7; display:inline-block; margin-top:6px;">📋 введено: ${emailVal} / ${passDisplay}</span>`;
        }

        function gentleFeedback() {
            // небольшая визуальная реакция без негатива
            const btnIcon = submitBtn.querySelector('i');
            const originalIcon = btnIcon.className;
            btnIcon.className = 'fas fa-check-circle';
            setTimeout(() => {
                btnIcon.className = originalIcon;
            }, 300);
            
            // лёгкое мерцание блока сообщения
            const infoBox = document.getElementById('infoBox');
            infoBox.style.transform = 'scale(1.01)';
            infoBox.style.background = 'rgba(120, 140, 180, 0.18)';
            setTimeout(() => {
                infoBox.style.transform = '';
                infoBox.style.background = '';
            }, 250);
            
            // плавное обновление сообщения
            updateDemoMessage();
        }

        // обработка клика / отправки — только визуальная красота, без текста "неправильно"
        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            gentleFeedback();
        });
        
        // Enter тоже даёт элегантный отклик
        const inputs = [emailInput, passwordInput];
        inputs.forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    e.preventDefault();
                    gentleFeedback();
                }
            });
            inp.addEventListener('input', () => {
                // просто обновляем отображаемые данные в заглушке
                updateDemoMessage();
                // небольшая плавная анимация блока
                const infoBox = document.getElementById('infoBox');
                infoBox.style.borderLeftColor = '#9aadcf';
                setTimeout(() => {
                    if(infoBox) infoBox.style.borderLeftColor = '#7c8db0';
                }, 300);
            });
        });
        
        // начальная установка сообщения
        updateDemoMessage();
        
        // автоплавное обновление сообщения каждые 7 секунд (меняем фразу)
        setInterval(() => {
            updateDemoMessage();
        }, 7000);
        
        // предотваращаем любые реальные отправки (на всякий случай)
        document.querySelectorAll('form').forEach(f => {
            f.addEventListener('submit', (e) => e.preventDefault());
        });
        
        // лёгкая анимация появления страницы
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.8s ease';
        setTimeout(() => { document.body.style.opacity = '1'; }, 50);
    })();
</script>
</body>
</html>
