<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login • Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #050f19 0%, #000000 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(255, 80, 120, 0.05), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .lang-btn {
            background: rgba(20, 28, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #cbd5e6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: rgba(100, 130, 200, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
        }

        .lang-btn:hover {
            background: rgba(100, 130, 200, 0.35);
        }

        .glass-card {
            background: rgba(20, 28, 40, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            padding: 2.5rem 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .lock-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #fff, #b0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(120deg, #FFFFFF, #C0D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.3rem;
        }

        .login-sub {
            color: #9aa9c1;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .input-group {
            margin-bottom: 1.3rem;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #7e8aa8;
            font-size: 1rem;
            pointer-events: none;
        }

        input {
            width: 100%;
            background: rgba(12, 18, 28, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            border-radius: 2rem;
            color: #f0f3fa;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: rgba(255, 130, 170, 0.6);
            background: rgba(18, 26, 40, 0.9);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(95deg, #2a2f42, #1e2335);
            border: none;
            padding: 0.9rem;
            border-radius: 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #eef3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-login:hover {
            background: linear-gradient(95deg, #3a3f58, #282e44);
            transform: translateY(-1px);
        }

        .error-message {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #ff8a9e;
            background: rgba(255, 70, 100, 0.1);
            padding: 0.7rem;
            border-radius: 1.5rem;
            border-left: 3px solid #ff5e7e;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #5c6a89;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 550px) {
            .glass-card { padding: 1.8rem 1.5rem; }
            .login-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">РУС</button>
        <button class="lang-btn" data-lang="en">ENG</button>
    </div>

    <div class="glass-card">
        <div class="login-header">
            <div class="lock-icon">
                <i class="fas fa-door-open"></i>
            </div>
            <div class="login-title" id="loginTitle">secure access</div>
            <div class="login-sub" id="loginSub">вход в систему</div>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="emailInput" placeholder="email@example.com" autocomplete="on">
        </div>
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="passwordInput" placeholder="пароль" autocomplete="on">
        </div>

        <button class="btn-login" id="loginBtn">
            <i class="fas fa-arrow-right-to-bracket"></i>
            <span id="loginBtnText">войти</span>
        </button>
        <div class="error-message" id="errorMessage" style="display: none;">
            <i class="fas fa-times-circle"></i>
            <span id="errorText">неверный логин или пароль</span>
        </div>
        <div class="footer-note" id="footerNote">
            <i class="fas fa-lock"></i> защищённая система
        </div>
    </div>
</div>

<script>
    const translations = {
        ru: {
            loginTitle: "secure access",
            loginSub: "вход в систему",
            emailPlaceholder: "email@example.com",
            passwordPlaceholder: "пароль",
            loginBtnText: "войти",
            errorText: "неверный логин или пароль",
            footerNote: "<i class='fas fa-lock'></i> защищённая система"
        },
        en: {
            loginTitle: "secure access",
            loginSub: "sign in to your account",
            emailPlaceholder: "email@example.com",
            passwordPlaceholder: "password",
            loginBtnText: "sign in",
            errorText: "incorrect login or password",
            footerNote: "<i class='fas fa-lock'></i> secured system"
        }
    };

    let currentLang = 'ru';

    function updateLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('loginTitle').innerText = t.loginTitle;
        document.getElementById('loginSub').innerText = t.loginSub;
        document.getElementById('emailInput').placeholder = t.emailPlaceholder;
        document.getElementById('passwordInput').placeholder = t.passwordPlaceholder;
        document.getElementById('loginBtnText').innerText = t.loginBtnText;
        document.getElementById('footerNote').innerHTML = t.footerNote;
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => updateLanguage(btn.getAttribute('data-lang')));
    });

    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorMessage = document.getElementById('errorMessage');
    const errorTextSpan = document.getElementById('errorText');

    function showError() {
        const t = translations[currentLang];
        errorTextSpan.innerText = t.errorText;
        errorMessage.style.display = 'block';

        
        loginBtn.style.transform = 'scale(0.98)';
        setTimeout(() => { loginBtn.style.transform = ''; }, 150);

        
        emailInput.style.transform = 'translateX(3px)';
        passwordInput.style.transform = 'translateX(3px)';
        setTimeout(() => {
            emailInput.style.transform = '';
            passwordInput.style.transform = '';
        }, 100);
        
        
        emailInput.value = '';
        passwordInput.value = '';
        emailInput.focus();
        
        
        setTimeout(() => {
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        }, 4000);
    }

    function handleLogin() {
        showError();
    }

    loginBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleLogin();
    });

    [emailInput, passwordInput].forEach(inp => {
        inp.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });
    });

    updateLanguage('ru');
</script>
</body>
</html>
